[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utsrocketrysim"
version = "0.1.0"
description = "Open-source N2O hybrid rocket engine simulator"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "CoolProp"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]